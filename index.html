        // Utility to convert row-based grid strings to column-wise matrices
        function parseGridFont(fontMap) {
            const result = {};
            for (let char in fontMap) {
                const rows = fontMap[char];
                const numRows = rows.length;
                const numCols = rows[0].length;
                const matrix = [];
                for (let col = 0; col < numCols; col++) {
                    const columnArr = new Array(numRows);
                    for (let row = 0; row < numRows; row++) {
                        columnArr[row] = rows[row][col] === '1' ? 1 : 0;
                    }
                    matrix.push(columnArr);
                }
                result[char] = matrix;
            }
            return result;
        }

            ' ': ["0000000","0000000","0000000","0000000","0000000","0000000","0000000"],
            '.': ["0000000","0000000","0000000","0000000","0000000","0110000","0110000"],
            ',': ["0000000","0000000","0000000","0000000","0110000","0010000","0100000"],
            '-': ["0000000","0000000","0000000","1111100","0000000","0000000","0000000"],
            '/': ["0000011","0000110","0001100","0011000","0110000","1100000","1000000"]
        });

        function getRouteCharMatrix(char) {
            if (ROUTE_GRID_16[char]) return ROUTE_GRID_16[char];
            if (ROUTE_GRID_16[char.toUpperCase()]) return ROUTE_GRID_16[char.toUpperCase()];
            if (ROUTE_GRID_16[char.toLowerCase()]) return ROUTE_GRID_16[char.toLowerCase()];

            // High-resolution double-stroke fallback generator for missing letters
            const base = CYRILLIC_GRID_8[char] || CYRILLIC_GRID_8[char.toUpperCase()] || CYRILLIC_GRID_8['0'];
            const scaled = [];

            for (let c = 0; c < base.length; c++) {
                const col16 = new Array(16).fill(0);
                for (let r = 0; r < 7; r++) {
                    if (base[c][r] === 1) {
                        col16[r * 2 + 1] = 1;
                        col16[r * 2 + 2] = 1;
                    }
                }
                scaled.push(col16);
                scaled.push([...col16]); // Bold stroke doubling
            }
            return scaled;
        }

        function getRoutePixelWidth(routeStr) {
            let width = 0;
            for (let char of routeStr) {
                const glyph = getRouteCharMatrix(char);
                width += glyph.length + 1;
            }
            return Math.max(width + 3, 26);
        }

        function measureTextWidth(textStr) {
            let width = 0;
            for (let char of textStr) {
                const glyph = CYRILLIC_GRID_8[char] || CYRILLIC_GRID_8[' '];
                width += glyph.length + 1;
            }
            return Math.max(0, width - 1);
        }

        function setPixel(x, y, val = 1) {
            if (x >= 0 && x < CANVAS_WIDTH && y >= 0 && y < CANVAS_HEIGHT) {
                grid[y][x] = val;
            }
        }

        function clearGrid() {
            for (let r = 0; r < CANVAS_HEIGHT; r++) {
                grid[r].fill(0);
            }
        }

        function renderRouteBlock(routeStr) {
            let currentX = 4; // Сдвинуто чуть правее (было 2)

            for (let char of routeStr) {
                const glyph = getRouteCharMatrix(char);
                for (let col = 0; col < glyph.length; col++) {
                    for (let row = 0; row < glyph[col].length; row++) {
                        if (glyph[col][row] === 1) {
                            setPixel(currentX + col, 4 + row);
                        }
                    }
                }
                currentX += glyph.length + 1;
            }

            // Разделительная линия убрана, возвращаем позицию для начала текста конечной
            return currentX + 2;
        }

        function renderTextLine(textStr, startX, startY, lineKey) {
            const availableWidth = CANVAS_WIDTH - startX - 1;
            const textWidth = measureTextWidth(textStr);

            let renderOffsetX = 0;

            if (textWidth <= availableWidth) {
                renderOffsetX = Math.floor((availableWidth - textWidth) / 2);
                document.getElementById('scroll-status').textContent = "Статус: Центрировано";
            } else {
                document.getElementById('scroll-status').textContent = "Статус: Пинг-Понг";
                
                if (scrollState[lineKey + 'Pause'] > 0) {
                    scrollState[lineKey + 'Pause']--;
                } else {
                    const maxScroll = -(textWidth - availableWidth);
                    scrollState[lineKey + 'Offset'] += scrollState[lineKey + 'Dir'] * state.speed;

                    if (scrollState[lineKey + 'Offset'] <= maxScroll) {
                        scrollState[lineKey + 'Offset'] = maxScroll;
                        scrollState[lineKey + 'Dir'] = 1;
                        scrollState[lineKey + 'Pause'] = 40;
                    } else if (scrollState[lineKey + 'Offset'] >= 0) {
                        scrollState[lineKey + 'Offset'] = 0;
                        scrollState[lineKey + 'Dir'] = -1;
                        scrollState[lineKey + 'Pause'] = 40;
                    }
                }
                renderOffsetX = Math.round(scrollState[lineKey + 'Offset']);
            }

            let curX = startX + renderOffsetX;

            for (let char of textStr) {
                const glyph = CYRILLIC_GRID_8[char] || CYRILLIC_GRID_8[' '];
                for (let col = 0; col < glyph.length; col++) {
                    const px = curX + col;
                    if (px >= startX && px < CANVAS_WIDTH) {
                        for (let row = 0; row < glyph[col].length; row++) {
                            if (glyph[col][row] === 1) {
                                setPixel(px, startY + row);
                            }
                        }
                    }
                }
                curX += glyph.length + 1;
            }
        }

        function drawGridToCanvas() {
            const palette = LED_PALETTES[state.color] || LED_PALETTES.amber;

            // Fill background with pitch black
            ctx.fillStyle = '#050608';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const dotRadius = (PIXEL_SCALE / 2) - 0.7;

            // Step 1: Draw unlit dots cleanly with NO blur or glow shadow
            for (let r = 0; r < CANVAS_HEIGHT; r++) {
                for (let c = 0; c < CANVAS_WIDTH; c++) {
                    if (grid[r][c] === 0) {
                        const cx = c * PIXEL_SCALE + PIXEL_SCALE / 2;
                        const cy = r * PIXEL_SCALE + PIXEL_SCALE / 2;
                        ctx.beginPath();
                        ctx.arc(cx, cy, dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = palette.dim;
                        ctx.fill();
                    }
                }
            }

            // Step 2: Draw active lit LEDs WITH ambient glow filter
            ctx.save();
            if (state.glow > 0) {
                ctx.shadowColor = palette.active;
                ctx.shadowBlur = (state.glow / 100) * 8;
            }

            for (let r = 0; r < CANVAS_HEIGHT; r++) {
                for (let c = 0; c < CANVAS_WIDTH; c++) {
                    if (grid[r][c] === 1) {
                        const cx = c * PIXEL_SCALE + PIXEL_SCALE / 2;
                        const cy = r * PIXEL_SCALE + PIXEL_SCALE / 2;
                        ctx.beginPath();
                        ctx.arc(cx, cy, dotRadius, 0, Math.PI * 2);
                        ctx.fillStyle = palette.active;
                        ctx.fill();
                    }
                }
            }
            ctx.restore();

            // Subtle panel seam lines
            ctx.strokeStyle = '#0d1017';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 16 * PIXEL_SCALE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
        }

        function updateAndRender() {
            clearGrid();

            const textStartX = renderRouteBlock(state.route);

            if (state.mode === 'dual') {
                renderTextLine(state.origin, textStartX, 2, 'line1');
                renderTextLine(state.destination, textStartX, 13, 'line2');
            } else if (state.mode === 'single_a') {
                renderTextLine(state.origin, textStartX, 8, 'line1');
            } else if (state.mode === 'single_b') {
                renderTextLine(state.destination, textStartX, 8, 'line2');
            }

            drawGridToCanvas();
            requestAnimationFrame(updateAndRender);
        }

        const inpRoute = document.getElementById('inp-route');
        const inpOrigin = document.getElementById('inp-origin');
        const inpDest = document.getElementById('inp-destination');
        const selColor = document.getElementById('sel-color');
        const selMode = document.getElementById('sel-mode');
        const rngSpeed = document.getElementById('rng-speed');
        const rngGlow = document.getElementById('rng-glow');

        function resetPingPongScroll() {
            scrollState.line1Offset = 0;
            scrollState.line1Dir = -1;
            scrollState.line1Pause = 30;
            scrollState.line2Offset = 0;
            scrollState.line2Dir = -1;
            scrollState.line2Pause = 30;
        }

        inpRoute.addEventListener('input', (e) => { state.route = e.target.value; resetPingPongScroll(); });
        inpOrigin.addEventListener('input', (e) => { state.origin = e.target.value; resetPingPongScroll(); });
        inpDest.addEventListener('input', (e) => { state.destination = e.target.value; resetPingPongScroll(); });
        selColor.addEventListener('change', (e) => state.color = e.target.value);
        selMode.addEventListener('change', (e) => { state.mode = e.target.value; resetPingPongScroll(); });
        rngSpeed.addEventListener('input', (e) => state.speed = parseFloat(e.target.value));
        rngGlow.addEventListener('input', (e) => state.glow = parseInt(e.target.value));

        document.getElementById('btn-export-png').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `emu_${state.route}_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        document.getElementById('btn-export-gif').addEventListener('click', () => {
            const btn = document.getElementById('btn-export-gif');
            btn.innerText = 'Создание...';
            btn.disabled = true;

            const frames = [];
            let captured = 0;
            const totalFrames = 25;

            const captureInterval = setInterval(() => {
                frames.push(canvas.toDataURL('image/png'));
                captured++;

                if (captured >= totalFrames) {
                    clearInterval(captureInterval);
                    gifshot.createGIF({
                        images: frames,
                        interval: 0.08,
                        gifWidth: canvas.width,
                        gifHeight: canvas.height
                    }, function (obj) {
                        if (!obj.error) {
                            const link = document.createElement('a');
                            link.download = `emu_${state.route}.gif`;
                            link.href = obj.image;
                            link.click();
                        }
                        btn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg><span>GIF</span>`;
                        btn.disabled = false;
                    });
                }
            }, 80);
        });

        // Start animation loop
        requestAnimationFrame(updateAndRender);
    </script>
</body>
</html>
